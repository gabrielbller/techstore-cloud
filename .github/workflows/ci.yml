name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write   # token OIDC para entrar na Azure sem senha

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build --configuration Release

      - name: Testes
        run: dotnet test --configuration Release --no-build

      - name: Publicar API
        run: dotnet publish src/TechStore.Produtos.Api -c Release -o publish/api

      - name: Validar Bicep
        run: az bicep build --file infra/main.bicep

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: publish/api

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: api
          path: publish/api

      - name: Login na Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy da API no App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish/api

      - name: Deploy do front-end no Blob Storage ($web)
        run: |
          echo "window.TECHSTORE_CONFIG = { apiBaseUrl: \"${{ vars.API_URL }}\" };" > frontend/config.js
          az storage blob upload-batch --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" --auth-mode login \
            --destination '$web' --source frontend --overwrite

      - name: Teste de fumaça
        run: curl -sf --retry 10 --retry-delay 10 --retry-all-errors "${{ vars.API_URL }}/health"
